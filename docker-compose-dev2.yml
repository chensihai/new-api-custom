# New-API Docker Compose Configuration (Debug build v2, optimized for 2C4G)
#
# Quick Start:
#   1. docker compose -f docker-compose-dev2.yml up -d
#   2. Access http://服务器IP:3000
#
# Default Admin Account: root / 123456
# ⚠️  IMPORTANT: Change admin password after login!

services:
  new-api:
    build:
      context: .
      dockerfile: Dockerfile.debug
    container_name: new-api
    restart: always
    ports:
      - "3000:3000"
      - "2345:2345"
    cap_add:
      - SYS_PTRACE
    security_opt:
      - "apparmor:unconfined"
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    environment:
      - SQL_DSN=postgresql://root:${PG_PASSWORD:-123456}@postgres:5432/new-api
      - REDIS_CONN_STRING=redis://:${REDIS_PASSWORD:-123456}@redis:6379
      - TZ=Asia/Shanghai
      - ERROR_LOG_ENABLED=true
      - BATCH_UPDATE_ENABLED=true
      - NODE_NAME=new-api-node-1

      - SMTP_SERVER=mailhog
      - SMTP_PORT=1025
      - SMTP_ACCOUNT=noreply@example.com
      - SMTP_FROM=noreply@example.com
      - SMTP_TOKEN=
      - SMTP_SSL=false

    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    networks:
      - new-api-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -o '\"success\":\\s*true' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:latest
    container_name: redis
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-123456}", "--maxmemory", "200mb", "--maxmemory-policy", "allkeys-lru"]
    networks:
      - new-api-network
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  postgres:
    image: postgres:15
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: ${PG_PASSWORD:-123456}
      POSTGRES_DB: new-api
    command: ["postgres", "-c", "shared_buffers=256MB", "-c", "effective_cache_size=512MB", "-c", "work_mem=4MB", "-c", "maintenance_work_mem=64MB", "-c", "max_connections=100"]
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - new-api-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d new-api"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.8'
          memory: 1024M
        reservations:
          cpus: '0.2'
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  dbadmin:
    image: adminer:latest
    container_name: dbadmin
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - redis
    networks:
      - new-api-network
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  mailhog:
    image: mailhog/mailhog
    container_name: mailhog
    restart: always
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - new-api-network
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  pg_data:

networks:
  new-api-network:
    driver: bridge
